<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 AI Assistant by Zimzz</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body { background:#0a0e27; color:#e0e0e0; height:100vh; display:flex; flex-direction:column; }

  .header {
    padding:16px 24px; background:#131829; border-bottom:1px solid #1f2937;
    display:flex; justify-content:space-between; align-items:center;
  }
  .header h1 { font-size:18px; color:#7c3aed; }
  .header small { font-size:11px; color:#6b7280; }
  .header strong { color:#7c3aed; }

  .settings {
    padding:12px 24px; background:#0f1424; border-bottom:1px solid #1f2937;
    display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:12px;
  }
  .settings input, .settings select {
    padding:8px 12px; background:#1f2937; border:1px solid #374151;
    color:#e0e0e0; border-radius:6px; font-size:12px; outline:none;
  }
  .settings input { flex:1; min-width:200px; }
  .settings button {
    padding:8px 16px; background:#7c3aed; border:none; color:white;
    border-radius:6px; cursor:pointer; font-weight:600; font-size:12px;
  }

  .chat-area {
    flex:1; overflow-y:auto; padding:24px;
    display:flex; flex-direction:column; gap:16px;
  }
  .message {
    max-width:80%; padding:12px 16px; border-radius:12px;
    line-height:1.6; font-size:14px; white-space:pre-wrap;
    animation:fadeIn 0.3s;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } }
  .message.user { align-self:flex-end; background:#7c3aed; color:white; }
  .message.assistant { align-self:flex-start; background:#1f2937; }
  .message.system { align-self:center; background:#1f2937; font-size:12px; opacity:0.7; }
  .message.error { align-self:center; background:#7f1d1d; color:#fca5a5; font-size:12px; }

  .input-area {
    padding:16px 24px; background:#131829; border-top:1px solid #1f2937;
    display:flex; gap:12px; align-items:flex-end;
  }
  textarea {
    flex:1; background:#1f2937; border:1px solid #374151;
    border-radius:12px; padding:12px 16px; color:white;
    resize:none; font-size:14px; outline:none; max-height:120px; font-family:inherit;
  }
  .send-btn {
    padding:12px 20px; background:#7c3aed; border:none; color:white;
    border-radius:12px; cursor:pointer; font-weight:600;
  }
  .send-btn:disabled { opacity:0.5; cursor:not-allowed; }

  .creator {
    text-align:center; font-size:11px; color:#6b7280;
    padding:8px; border-top:1px solid #1f2937;
  }
  .creator strong { color:#7c3aed; }
</style>
</head>
<body>

<div class="header">
  <h1>🤖 AI Assistant</h1>
  <small>by <strong>Zimzz</strong> · HTML/CSS/JS</small>
</div>

<div class="settings">
  <select id="provider">
    <option value="google" selected>Google (Gemini)</option>
    <option value="openai">OpenAI (GPT)</option>
    <option value="anthropic">Anthropic (Claude)</option>
  </select>
  <input id="apiKey" type="password" placeholder="API key...">
  <button onclick="saveKey()">💾 Simpan</button>
</div>

<div class="chat-area" id="chatArea">
  <div class="message assistant">Halo! Saya AI Assistant by Zimzz. Isi API key di atas, lalu mulai chat. 🚀</div>
  <div class="message system" id="hint">💡 Pastikan kamu membuka file ini lewat <strong>localhost</strong>, bukan dobel-klik (file://). Lihat petunjuk di bawah.</div>
</div>

<div class="input-area">
  <textarea id="chatInput" rows="1" placeholder="Ketik pesan..."></textarea>
  <button class="send-btn" id="sendBtn">Kirim</button>
</div>

<div class="creator">Dibuat oleh <strong>Zimzz</strong></div>

<script>
const chatArea = document.getElementById('chatArea');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const provider = document.getElementById('provider');
const apiKeyInput = document.getElementById('apiKey');
let history = [];

const savedKey = localStorage.getItem('ai_api_key');
if (savedKey) apiKeyInput.value = savedKey;

function saveKey() {
  localStorage.setItem('ai_api_key', apiKeyInput.value.trim());
  addMsg('✅ API key tersimpan.', 'system');
}

function addMsg(text, role) {
  const div = document.createElement('div');
  div.className = 'message ' + role;
  div.textContent = text;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

async function send() {
  const text = chatInput.value.trim();
  const key = apiKeyInput.value.trim();
  const prov = provider.value;
  if (!text) return;
  if (!key) { addMsg('⚠️ Isi API key dulu.', 'error'); return; }

  addMsg(text, 'user');
  history.push({ role: 'user', content: text });
  chatInput.value = '';
  sendBtn.disabled = true;
  sendBtn.textContent = '...';

  try {
    let reply = '';
    if (prov === 'openai') reply = await callOpenAI(key, history);
    else if (prov === 'anthropic') reply = await callClaude(key, history);
    else if (prov === 'google') reply = await callGemini(key, history);
    addMsg(reply, 'assistant');
    history.push({ role: 'assistant', content: reply });
  } catch (e) {
    addMsg('❌ ' + e.message, 'error');
    console.error('Detail error:', e);
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = 'Kirim';
  }
}

async function callOpenAI(key, msgs) {
  const r = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + key },
    body: JSON.stringify({ model:'gpt-4o-mini', messages:[{role:'system',content:'Kamu asisten AI.'},...msgs] })
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error.message);
  return d.choices[0].message.content;
}

async function callClaude(key, msgs) {
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type':'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({ model:'claude-3-haiku-20240307', max_tokens:2000, system:'Kamu asisten AI.', messages:msgs })
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error.message);
  return d.content[0].text;
}

// ✅ DIPERBARUI: Endpoint v1beta + model gemini-flash-latest
async function callGemini(key, msgs) {
  const contents = msgs.map(m => ({ role: m.role === 'user' ? 'user' : 'model', parts:[{text:m.content}] }));
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${key}`;
  
  const r = await fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ contents })
  });
  
  const d = await r.json();
  
  // Penanganan error yang lebih jelas
  if (d.error) {
    throw new Error(`${d.error.status}: ${d.error.message}`);
  }
  if (!d.candidates || !d.candidates[0] || !d.candidates[0].content) {
    throw new Error('Respons Gemini tidak valid. Cek API key dan kuota.');
  }
  
  return d.candidates[0].content.parts[0].text;
}

chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.onclick = send;
</script>
</body>
</html>
